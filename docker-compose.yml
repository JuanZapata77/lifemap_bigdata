services:
  mongodb:
    image: mongo:6.0
    container_name: lifemap_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - lifemap_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  dask-scheduler:
    image: ghcr.io/dask/dask:latest
    container_name: lifemap_dask_scheduler
    command: ["dask", "scheduler"]
    ports:
      - "8786:8786"
      - "8787:8787"
    volumes:
      - ./jobs:/app/jobs
      - ./data:/data
    networks:
      - lifemap_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8787/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  dask-worker-1:
    image: ghcr.io/dask/dask:latest
    command: ["dask", "worker", "tcp://dask-scheduler:8786"]
    volumes:
      - ./jobs:/app/jobs
      - ./data:/data
    depends_on:
      - dask-scheduler
    networks:
      - lifemap_net

  dask-worker-2:
    image: ghcr.io/dask/dask:latest
    command: ["dask", "worker", "tcp://dask-scheduler:8786"]
    volumes:
      - ./jobs:/app/jobs
      - ./data:/data
    depends_on:
      - dask-scheduler
    networks:
      - lifemap_net

  spark-master:
    image: apache/spark:3.5.1
    container_name: lifemap_spark_master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./jobs:/app/jobs
      - ./models:/models
      - ./data:/data
    networks:
      - lifemap_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 5

  spark-worker:
    image: apache/spark:3.5.1
    container_name: lifemap_spark_worker
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    depends_on:
      - spark-master
    volumes:
      - ./jobs:/app/jobs
      - ./models:/models
      - ./data:/data
    networks:
      - lifemap_net

  api:
    build: ./api
    container_name: lifemap_api
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/lifemap
      - DASK_SCHEDULER_HTTP=http://dask-scheduler:8787/health
      - SPARK_MASTER_HTTP=http://spark-master:8080
      - GIT_COMMIT=${GIT_COMMIT:-765f66a}
    volumes:
      - ./models:/models
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - lifemap_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: lifemap_tunnel
    command: tunnel --no-autoupdate --protocol http2 --url http://api:5000
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      - api
    networks:
      - lifemap_net

  jenkins:
    image: jenkins/jenkins:lts
    container_name: lifemap_jenkins
    user: root
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - lifemap_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/login"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  lifemap_net:
    driver: bridge

volumes:
  mongo_data:
  jenkins_home:
